<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07050f; font-family: system-ui, sans-serif; color: #ffe6b0; }
    canvas { display: block; touch-action: none; cursor: grab; }
    .ov { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }
    #hud { top: 12px; left: 14px; line-height: 1.55; font-size: 15px; background: #0b0716aa; padding: 8px 12px; border-radius: 10px; }
    #hud b { color: #ffb84d; }
    #prompt { bottom: 70px; left: 0; right: 0; text-align: center; font-size: 18px; color: #ffd27a; }
    #help { bottom: 10px; left: 14px; right: 14px; font-size: 13px; opacity: .75; }
    #flash { inset: 0; background: radial-gradient(transparent 40%, #5a1a8acc); opacity: 0; }
    #end { inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #07050fcc; font-size: 20px; gap: 8px; }
    #end h1 { margin: 0; font-size: 48px; color: #ffb84d; }
  </style>
</head>
<body>
  <div id="hud" class="ov"></div>
  <div id="prompt" class="ov"></div>
  <div id="help" class="ov">WASD: di chuyển · Kéo chuột hoặc ←/→: xoay camera · Space: nhảy · E: nạp đèn · F: tỏa sáng · R: chơi lại (khi kết thúc)</div>
  <div id="flash" class="ov"></div>
  <div id="end" class="ov"><h1 id="end-title"></h1><div id="end-reason"></div><div id="end-score"></div><div>Nhấn R để chơi lại</div></div>
  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
