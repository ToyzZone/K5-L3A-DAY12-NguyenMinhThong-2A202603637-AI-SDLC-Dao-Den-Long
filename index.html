<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    /* --u: 1 px chữ; chữ lớn (Ticket-04 §4) nhân 1.25. Mọi chữ UI ≥ 18 px ở 1280×720. */
    :root { --text: #F5F1E6; --gold: #F2C14E; --danger: #FF5A5F; --red: #C8102E; --u: 1px; }
    body.big { --u: 1.25px; }
    body.rm * { animation: none !important; } /* giảm chuyển động */
    small { font-size: calc(18 * var(--u)); opacity: .85; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, sans-serif; color: var(--text); font-size: calc(18 * var(--u)); }
    canvas { display: block; touch-action: none; cursor: grab; }
    .ov { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }
    #hud { inset: 0; display: none; }
    #hud > * { position: absolute; }
    #flames { top: 14px; left: 16px; display: flex; gap: 8px; align-items: center; }
    .fl { width: 18px; height: 18px; background: #FFB347; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 0 10px #FFB347; }
    .fl.off { background: #3a3450; box-shadow: none; }
    #timer { top: 10px; left: 50%; transform: translateX(-50%); font-size: calc(32 * var(--u)); font-weight: 700; }
    #timer.danger { color: var(--danger); animation: blink .8s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    body.cb { --danger: #FFFFFF; }
    body.cb #timer.danger::before { content: '⚠ '; }
    body.cb #flash { background: radial-gradient(transparent 40%, #00B3FFcc); }
    #motebar { align-items: center; }
    #motebar b { margin-left: 8px; font-size: calc(20 * var(--u)); color: #FFE58A; }
    #cues { top: calc(56 * var(--u)); left: 50%; transform: translateX(-50%); text-align: center; font-size: calc(22 * var(--u)); font-weight: 700; line-height: 1.4; }
    #cues div { background: #0E1430b3; border-radius: 6px; padding: 2px 12px; margin-bottom: 4px; }
    #cues .warn { color: #FFE9B0; } #cues .danger { color: var(--danger); } #cues .wind { color: #CFE0F5; }
    #tr { top: 12px; right: 16px; text-align: right; font-size: calc(18 * var(--u)); line-height: 1.5; }
    #tr b { color: var(--gold); font-size: calc(22 * var(--u)); }
    #tr small { font-size: calc(18 * var(--u)); opacity: .85; }
    #motebar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
    #motebar i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #FFE58A66; }
    #motebar i.on { background: #FFF6C2; border-color: #FFE58A; box-shadow: 0 0 10px #FFE58A; }
    #cds { bottom: 16px; right: 16px; display: flex; gap: 12px; }
    .cd { width: calc(76 * var(--u)); height: calc(76 * var(--u)); border-radius: 50%; border: 3px solid var(--gold); display: grid; place-items: center; font-size: calc(18 * var(--u)); font-weight: 700; background: #FFB34755; }
    .cd.off { border-color: #5B5F6E; background: #5B5F6E55; }
    .cd.charm { border-color: var(--red); }
    #prompt { bottom: calc(64 * var(--u)); left: 0; right: 0; text-align: center; font-size: calc(22 * var(--u)); color: #FFE9B0; }
    #arrow, #sarrow { width: 26px; height: 26px; background: #FFB347; clip-path: polygon(0 15%, 100% 50%, 0 85%, 22% 50%); filter: drop-shadow(0 0 6px #FFB347); }
    #sarrow { width: 34px; height: 34px; background: #B98CFF; filter: drop-shadow(0 0 6px #7A3CFF); }
    body.cb #sarrow { background: #00B3FF; }
    #help { bottom: calc(100 * var(--u)); left: 16px; font-size: calc(18 * var(--u)); opacity: .8; max-width: calc(330 * var(--u)); line-height: 1.4; }
    #fps { top: 70px; left: 16px; font: calc(18 * var(--u)) monospace; }
    #flash { inset: 0; background: radial-gradient(transparent 40%, #7A3CFFcc); opacity: 0; }
    #panel { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #0E1430cc; text-align: center; padding: 16px; }
    #panel h1 { margin: 0; font-size: calc(46 * var(--u)); color: var(--gold); }
    #panel { overflow-y: auto; }
    #panel h2 { margin: 0; font-weight: 400; letter-spacing: 2px; }
    #panel p { margin: 4px 0; max-width: 520px; }
    #panel .quote { font-style: italic; color: #FFE9B0; }
    #panel button, #panel input[type=text], #panel select { font: inherit; font-size: calc(18 * var(--u)); min-width: 220px; padding: 8px 18px; border-radius: 22px; border: 2px solid var(--gold); background: #1B2350; color: var(--text); cursor: pointer; }
    #panel button:hover, #panel button:focus-visible { background: #F2C14E33; }
    #panel label { display: flex; gap: 10px; align-items: center; }
    #panel input[type=text] { min-width: 0; width: calc(240 * var(--u)); border-radius: 8px; text-align: center; }
    #panel .keys { display: grid; grid-template-columns: repeat(2, auto auto); gap: 6px 14px; align-items: center; text-align: right; }
    #panel .keys button { min-width: calc(130 * var(--u)); padding: 4px 10px; }
    #panel .keys button.dup { border-color: var(--danger); color: var(--danger); }
    #panel .err { color: var(--danger); min-height: 1.4em; }
    #panel table { border-collapse: collapse; } #panel td, #panel th { padding: 4px 12px; } #panel tr.me td { color: var(--gold); }
    #panel .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div id="hud" class="ov">
    <div id="flames"></div>
    <div id="timer"></div>
    <div id="tr"></div>
    <div id="cues"></div>
    <div id="motebar"></div>
    <div id="cds"><div class="cd" id="cd-dash">Lướt</div><div class="cd" id="cd-pulse">Tỏa</div></div>
    <div id="prompt"></div>
    <div id="arrow"></div>
    <div id="sarrow"></div>
    <div id="help"></div>
    <div id="fps"></div>
  </div>
  <div id="flash" class="ov"></div>
  <div id="panel"></div>
  <script type="module" src="/src/web/main.ts"></script>
</body>
</html>
