<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng · chọn giao diện</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" />
  <style>
    /* Giống index.html để CSS HUD của theme áp lên đúng như trong game. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1430; font-family: system-ui, sans-serif; color: #f5f1e6; }
    canvas { display: block; touch-action: none; cursor: grab; }
    .ov { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }
    #hud { top: 12px; left: 14px; line-height: 1.55; font-size: 15px; background: #0b0716aa; padding: 8px 12px; border-radius: 10px; }
    #prompt { bottom: 70px; left: 0; right: 0; text-align: center; font-size: 18px; }
    #help { bottom: 10px; left: 14px; right: 380px; font-size: 13px; opacity: .75; }
    #end { inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #07050fcc; font-size: 20px; gap: 8px; }
    #end h1 { margin: 0; font-size: 48px; }

    /* Bảng chọn của trang xem trước (không thuộc game). */
    #pick { position: fixed; top: 12px; right: 12px; width: min(340px, calc(100vw - 24px)); box-sizing: border-box; padding: 14px 16px 16px;
      font: 14px/1.5 'Be Vietnam Pro', system-ui, sans-serif; color: #f5f1e6; background: #0e1430d9; backdrop-filter: blur(8px);
      border: 1px solid #f5f1e626; border-radius: 12px; }
    #pick h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    #tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    #tabs a { flex: 1 1 auto; padding: 7px 10px; text-align: center; font-size: 13px; font-weight: 600; color: inherit; text-decoration: none;
      border: 1px solid #f5f1e640; border-radius: 8px; }
    #tabs a:hover { border-color: #f2c14e; }
    #tabs a[aria-current] { background: #f2c14e; border-color: #f2c14e; color: #0e1430; }
    #pick p { margin: 10px 0 0; color: #f5f1e6d9; }
    #credit { font-size: 12.5px; color: #f5f1e6a6; }
    #pick label { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    #pick input { flex: 1; accent-color: #f2c14e; }
    #pick output { min-width: 2.5em; text-align: right; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 6px; margin-top: 12px; }
    .row button { flex: 1; padding: 7px 8px; font: inherit; font-size: 13px; color: inherit; cursor: pointer;
      background: #f5f1e614; border: 1px solid #f5f1e640; border-radius: 8px; }
    .row button:hover { border-color: #f2c14e; }
    #pick :focus-visible { outline: 2px solid #f2c14e; outline-offset: 2px; }
    @media (max-width: 720px) { #pick { top: auto; bottom: 12px; } #help, #prompt { display: none; } }
  </style>
</head>
<body>
  <div id="hud" class="ov"></div>
  <div id="prompt" class="ov">E — Nạp ánh sáng (5/10)</div>
  <div id="help" class="ov">WASD: di chuyển · Kéo chuột hoặc ←/→: xoay camera · Space: nhảy · E: nạp đèn · F: tỏa sáng · R: chơi lại (khi kết thúc)</div>
  <div id="end" class="ov"><h1 id="end-title">Thắng!</h1><div id="end-reason">Giữ đảo sáng tới bình minh</div><div id="end-score">Điểm: 1 240</div><div>Nhấn R để chơi lại</div></div>
  <aside id="pick">
    <h2>Chọn giao diện</h2>
    <nav id="tabs"></nav>
    <p id="blurb"></p>
    <p id="credit" hidden></p>
    <label for="lit">Đèn đã thắp <input id="lit" type="range" min="0" max="5" step="1" value="1" /> <output id="lit-out" for="lit">1/5</output></label>
    <div class="row">
      <button id="end-btn" type="button">Xem màn kết thúc</button>
      <button id="mute" type="button" hidden>Tắt nhạc</button>
    </div>
  </aside>
  <script type="module" src="/src/web/preview.ts"></script>
</body>
</html>
