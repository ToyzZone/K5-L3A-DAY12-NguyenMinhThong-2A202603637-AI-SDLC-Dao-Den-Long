name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: build_cmd (như máy chấm)
        run: npm ci && npm run build
      - name: headless_cmd chạy được
        run: node dist/headless.js --seed 1 --night 1 --ticks 600 --out out.jsonl && tail -1 out.jsonl
      - name: soak_cmd (Ticket-04 §2) trên Linux
        run: node --jitless --max-semi-space-size=1 dist/soak.js --seed 7 --nights 10 --out soak-ci.json && cat soak-ci.json
      - name: run_cmd --export-leaderboard
        run: node scripts/play.mjs --export-leaderboard lb.json && cat lb.json
      - name: test
        run: node --test tests/*.test.mjs
